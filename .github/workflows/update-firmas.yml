name: Actualizar firmas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar firmas.json
        env:
          MB_API_KEY: ${{ secrets.MB_API_KEY }}
        run: python update_firmas.py

      - name: Subir cambios si los hay
        run: |
          git config user.name "mc-shield-firmas[bot]"
          git config user.email "bot@mcshield.dev"
          git add firmas.json
          if git diff --cached --quiet; then
            echo "Sin cambios en firmas.json"
          else
            git commit -m "Actualización automática de firmas $(date +%Y-%m-%d)"
            git push
          fi
